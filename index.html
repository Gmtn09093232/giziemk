<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Bingo Lobby</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing:border-box; -webkit-user-select:none; user-select:none; }
    body {
      margin:0;
      font-family:system-ui;
      background: radial-gradient(circle at top, #0d1b2a, #05080f);
      color:#fff;
      padding:15px;
    }
    .hidden { display:none !important; }
    .page {
      background:#111b27;
      padding:20px;
      border-radius:20px;
      max-width: 450px;
      margin: auto;
    }
    .balance-box {
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:#0a1620;
      padding:12px;
      border-radius:12px;
      margin-bottom:15px;
    }
    button {
      background:#f39c12;
      color:#000;
      border:none;
      padding:12px 20px;
      border-radius:12px;
      font-weight:bold;
      cursor:pointer;
    }
    button:active { opacity:0.8; }
    .timer {
      font-size:24px;
      font-weight:bold;
      margin:10px 0;
    }
    .card-container {
      margin: 20px 0;
    }
    table {
      border-collapse: collapse;
      margin: auto;
    }
    td {
      width: 45px;
      height: 45px;
      border: 2px solid #2e3b4e;
      text-align: center;
      vertical-align: middle;
      font-weight: bold;
      cursor: default;
      background: #1b2a38;
    }
    td.marked {
      background: #ffd966;
      color: #000;
    }
    td.free {
      background: #3a4a5a;
      font-style: italic;
    }
    #calledList {
      max-height: 80px;
      overflow-y: auto;
      margin: 10px 0;
      font-size: 14px;
      color:#aaa;
    }
    #currentCall {
      font-size: 40px;
      margin: 10px 0;
      font-weight: bold;
    }
    .status-msg {
      color:#ffd966;
      font-weight:bold;
    }
  </style>
</head>
<body>
  <!-- LOBBY PAGE -->
  <div id="lobbyPage" class="page">
    <h2>🎰 Bingo Lobby</h2>
    <div class="balance-box">
      <span>💰 Balance: <b id="lobbyBalance">0</b></span>
    </div>
    <p class="timer" id="lobbyTimer">30s</p>
    <div class="card-container" id="lobbyCard"></div>
    <button id="newCardBtn">🔄 New Card</button>
    <p>👥 Players: <span id="playersCount">0</span></p>
  </div>

  <!-- GAME PAGE -->
  <div id="gamePage" class="page hidden">
    <h2>⚡ Game</h2>
    <div class="balance-box">
      <span>💰 Balance: <b id="gameBalance">0</b></span>
    </div>
    <div id="currentCall">-</div>
    <div class="card-container" id="gameCard"></div>
    <div id="calledList">Called: </div>
    <button id="bingoBtn">🏆 BINGO!</button>
  </div>

  <script>
    // =====================
    // Telegram WebApp
    // =====================
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // =====================
    // Global state
    // =====================
    let socket;
    let userCard = [];
    let markedNumbers = [];
    let isGameActive = false;
    let lobbyTimerInterval = null;

    const lobbyPage = document.getElementById('lobbyPage');
    const gamePage = document.getElementById('gamePage');
    const lobbyTimerEl = document.getElementById('lobbyTimer');
    const playersCountEl = document.getElementById('playersCount');
    const lobbyBalanceEl = document.getElementById('lobbyBalance');
    const gameBalanceEl = document.getElementById('gameBalance');
    const currentCallEl = document.getElementById('currentCall');
    const calledListEl = document.getElementById('calledList');

    // =====================
    // Render 5x5 card
    // =====================
    function renderCard(card, containerId, clickable = false) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      const table = document.createElement('table');
      for (let r = 0; r < 5; r++) {
        const tr = document.createElement('tr');
        for (let c = 0; c < 5; c++) {
          const td = document.createElement('td');
          const value = card[r][c];
          td.textContent = value;
          if (value === 'FREE') {
            td.classList.add('free');
          }
          if (markedNumbers.includes(value)) {
            td.classList.add('marked');
          }
          if (clickable && value !== 'FREE') {
            td.style.cursor = 'pointer';
            td.addEventListener('click', () => {
              if (!isGameActive) return;
              socket.emit('markNumber', value);
            });
          }
          tr.appendChild(td);
        }
        table.appendChild(tr);
      }
      container.appendChild(table);
    }

    // =====================
    // Switch pages
    // =====================
    function showLobby(timeLeft) {
      lobbyPage.classList.remove('hidden');
      gamePage.classList.add('hidden');
      isGameActive = false;
      startLobbyTimer(timeLeft);
      socket.emit('getBalance');
    }

    function showGame() {
      lobbyPage.classList.add('hidden');
      gamePage.classList.remove('hidden');
      isGameActive = true;
      clearInterval(lobbyTimerInterval);
      socket.emit('getBalance');
    }

    function startLobbyTimer(seconds) {
      let left = seconds || 0;
      lobbyTimerEl.textContent = left + 's';
      if (lobbyTimerInterval) clearInterval(lobbyTimerInterval);
      lobbyTimerInterval = setInterval(() => {
        left--;
        if (left <= 0) {
          clearInterval(lobbyTimerInterval);
          showGame();
        } else {
          lobbyTimerEl.textContent = left + 's';
        }
      }, 1000);
    }

    // =====================
    // Socket.IO connection
    // =====================
    async function connect() {
      // Authenticate via Telegram
      const initData = tg.initData;
      if (!initData) {
        alert('Open inside Telegram Mini App');
        return;
      }

      const res = await fetch('/api/telegram-miniapp-auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData })
      });
      const data = await res.json();
      if (!data.success) {
        alert('Auth failed');
        return;
      }

      // Now connect to Socket.IO
      socket = io();

      socket.on('connect', () => {
        console.log('Socket connected');
        socket.emit('joinLobby');  // auto‑join the current lobby
      });

      socket.on('balanceUpdate', (bal) => {
        lobbyBalanceEl.textContent = bal;
        gameBalanceEl.textContent = bal;
      });

      // Lobby events
      socket.on('yourCard', (card) => {
        userCard = card;
        if (isGameActive) {
          renderCard(card, 'gameCard', true);
        } else {
          renderCard(card, 'lobbyCard');
        }
      });

      socket.on('playersCount', (count) => {
        playersCountEl.textContent = count;
      });

      socket.on('lobbyState', (data) => {
        showLobby(data.startsIn);
      });

      socket.on('lobbyStarted', (data) => {
        showLobby(data.startsIn);
      });

      // Game events
      socket.on('gameStarted', () => {
        showGame();
      });

      socket.on('numberCalled', (data) => {
        currentCallEl.textContent = data.number;
        calledListEl.textContent = 'Called: ' + (data.calledNumbers || []).join(', ');
      });

      socket.on('calledNumbers', (called) => {
        calledListEl.textContent = 'Called: ' + called.join(', ');
      });

      socket.on('markedNumbers', (numbers) => {
        markedNumbers = numbers;
        if (isGameActive && userCard.length) {
          renderCard(userCard, 'gameCard', true);
        }
      });

      socket.on('gameEnded', (data) => {
        isGameActive = false;
        if (data.winner) {
          alert('🎉 Winner: ' + data.winner);
        } else {
          alert('Game ended with no winner');
        }
        // Server will auto‑switch to lobby after a few seconds
      });

      socket.on('invalidBingo', () => {
        alert('❌ Not a valid bingo yet!');
      });

      socket.on('errorMsg', (msg) => {
        alert(msg);
      });

      socket.on('disconnect', () => {
        console.log('Socket disconnected');
      });
    }

    // =====================
    // Button handlers
    // =====================
    document.getElementById('newCardBtn').addEventListener('click', () => {
      if (!isGameActive && socket) {
        socket.emit('newCard');
      }
    });

    document.getElementById('bingoBtn').addEventListener('click', () => {
      if (socket) {
        socket.emit('claimBingo');
      }
    });

    // =====================
    // Start everything
    // =====================
    connect();
  </script>
</body>
</html>
