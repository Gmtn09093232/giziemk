<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>✨ Nebula Bingo</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      min-height:100vh;
      background:radial-gradient(ellipse at 30% 10%, #0b1120, #03060c);
      font-family:'Segoe UI','Inter',system-ui,sans-serif;
      padding:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
    }

    .page{
      max-width:500px;
      width:100%;
      background:rgba(18,25,45,.65);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      border-radius:48px;
      padding:20px 20px 28px;
      box-shadow:0 25px 45px rgba(0,0,0,.5);
      border:1px solid rgba(243,156,18,.25);
    }

    .hidden{
      display:none !important;
    }

    h2{
      font-size:1.9rem;
      font-weight:700;
      background:linear-gradient(135deg,#ffe6b0,#f39c12);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      margin-bottom:12px;
    }

    .info-grid{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      background:rgba(5,12,22,.7);
      border-radius:60px;
      padding:8px 16px;
      margin-bottom:24px;
      border:1px solid rgba(243,156,18,.3);
      flex-wrap:wrap;
    }

    .balance-box{
      display:flex;
      align-items:center;
      gap:10px;
      background:#0a121f;
      padding:6px 16px;
      border-radius:40px;
      font-weight:600;
    }

    .balance-box b{
      color:#f7b32b;
    }

    .timer{
      font-size:2rem;
      font-weight:800;
      color:#f39c12;
      font-family:monospace;
    }

    .players-badge{
      background:#fff;
      color:#000;
      padding:6px 16px;
      border-radius:60px;
      font-size:.9rem;
      font-weight:600;
    }

    button{
      background:linear-gradient(105deg,#f39c12,#e67e22);
      border:none;
      padding:10px 18px;
      border-radius:60px;
      font-weight:700;
      color:#111;
      cursor:pointer;
    }

    #depositBtn,
    #withdrawBtn{
      background:#2c3e4e;
      color:#ffd966;
    }

    #randomCardBtn{
      background:linear-gradient(135deg,#4a6a8a,#2a4a6a);
      color:#ffecb3;
    }

    #bingoBtn{
      width:100%;
      margin-top:14px;
      padding:14px;
      font-size:1.2rem;
      background:linear-gradient(115deg,#e67e22,#f1c40f);
    }

    .grid-100{
      display:grid;
      grid-template-columns:repeat(10,1fr);
      gap:8px;
      margin:20px 0;
    }

    .grid-cell{
      background:rgba(20,32,48,.8);
      border-radius:14px;
      aspect-ratio:1/1;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      cursor:pointer;
      border:1px solid rgba(255,215,120,.3);
    }

    .grid-cell.taken{
      background:#6d2e2e;
      text-decoration:line-through;
      opacity:.6;
      cursor:not-allowed;
    }

    .grid-cell.selected{
      background:radial-gradient(circle at 30% 20%,#f7b32b,#e67e22);
      color:#000;
    }

    .card-container{
      margin-top:18px;
      display:flex;
      justify-content:center;
      background:rgba(0,0,0,.3);
      border-radius:32px;
      padding:10px;
    }

    .card-container table{
      border-collapse:separate;
      border-spacing:6px;
    }

    .card-container td{
      width:58px;
      height:58px;
      background:#0f1a24;
      border-radius:18px;
      text-align:center;
      font-weight:700;
      border:1px solid rgba(243,156,18,.5);
    }

    .card-container td.marked{
      background:radial-gradient(circle at 30% 35%,#f7d44a,#e67e22);
      color:#111;
    }

    .card-container td.free{
      background:#2a3e4e;
      color:#ffd966;
    }

    .call-hero{
      background:linear-gradient(145deg,#0b121f,#03060c);
      border-radius:80px;
      padding:12px 20px;
      text-align:center;
      margin:20px 0 10px;
      border:1px solid #f39c12;
    }

    #currentCall{
      font-size:4rem;
      font-weight:800;
      font-family:monospace;
      color:#ffd966;
    }

    #calledList{
      background:rgba(0,0,0,.5);
      border-radius:48px;
      padding:12px 16px;
      font-size:.85rem;
      color:#ffe0aa;
      overflow-x:auto;
      white-space:nowrap;
      margin:12px 0;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.8);
      display:flex;
      align-items:center;
      justify-content:center;
      visibility:hidden;
      opacity:0;
      transition:.2s;
      z-index:999;
    }

    .modal.active{
      visibility:visible;
      opacity:1;
    }

    .modal-content{
      background:rgba(20,30,50,.95);
      border-radius:40px;
      padding:24px 20px;
      width:90%;
      max-width:360px;
      border:1px solid #f39c12;
      text-align:center;
    }

    .modal-content h3{
      color:#ffd966;
      margin-bottom:20px;
    }

    .modal-content input,
    .modal-content .file-label{
      width:100%;
      margin:12px 0;
      padding:14px;
      border-radius:60px;
      border:none;
      background:#0f1a24;
      color:white;
      text-align:center;
    }

    .modal-content .file-label{
      background:#2c3e4e;
      cursor:pointer;
      display:block;
    }

    .modal-content input[type=file]{
      display:none;
    }

    .modal-buttons{
      display:flex;
      gap:12px;
      margin-top:20px;
    }

    .close-modal{
      background:#4a2f2f;
      color:#ffb3b3;
    }

    @media(max-width:520px){
      .card-container td{
        width:48px;
        height:48px;
      }

      #currentCall{
        font-size:2.8rem;
      }
    }
  </style>
</head>

<body>

  <!-- Deposit Modal -->
  <div id="depositModal" class="modal">
    <div class="modal-content">
      <h3>📸 Deposit by Telebirr to 0924839730</h3>

      <input type="tel" id="depositPhone" placeholder="09xxxxxxxx">

      <label class="file-label" for="proofImage">
        📎 Attach payment screenshot
      </label>

      <input type="file" id="proofImage" accept="image/*">

      <div class="modal-buttons">
        <button id="submitDepositBtn">✔ Submit</button>
        <button id="closeModalBtn" class="close-modal">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Lobby -->
  <div id="lobbyPage" class="page">

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <h2>🎰 NEBULA BINGO</h2>
      <div class="players-badge">
        👥 <span id="playersCount">0</span>
      </div>
    </div>

    <div class="info-grid">

      <div class="balance-box">
        <span>💰 BAL</span>
        <b id="lobbyBalance">0</b>

        <div style="display:flex;gap:6px;margin-left:8px;">
          <button id="depositBtn">+Deposit</button>
          <button id="withdrawBtn">-Withdraw</button>
        </div>
      </div>

      <div class="timer" id="lobbyTimer">30s</div>
    </div>

    <div style="display:flex;justify-content:space-between;margin:10px 0;">
      <span>🎯 Pick card ID:</span>

      <div>
        🎴 Selected:
        <span id="selectedNumber">-</span>
      </div>

      <button id="randomCardBtn">✨ Random Card</button>
    </div>

    <div id="numberGrid" class="grid-100"></div>

    <div style="margin-top:8px;">🎴 Your card preview</div>

    <div id="lobbyCardPreview" class="card-container"></div>

  </div>

  <!-- Game -->
  <div id="gamePage" class="page hidden">

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">

      <h2>⚡ LIVE BINGO</h2>

      <div style="display:flex;gap:10px;align-items:center;">

        <div class="players-badge">
          👥 <span id="gamePlayersCount">0</span>
        </div>

        <div class="balance-box">
          <span>💰</span>
          <b id="gameBalance">0</b>
        </div>

      </div>
    </div>

    <div style="
      background:rgba(0,0,0,.45);
      border:1px solid rgba(243,156,18,.35);
      border-radius:30px;
      padding:12px 18px;
      margin-bottom:14px;
      text-align:center;
      color:#ffd966;
      font-weight:700;
    ">
      🏆 Winning Prize:
      <span id="winningBalance" style="color:#f7b32b;font-size:1.3rem;">
        0
      </span>
      ETB
    </div>

    <div class="call-hero">
      <div style="font-size:.8rem;">🎲 LAST CALL</div>
      <div id="currentCall">-</div>
    </div>

    <div id="calledList">Called: —</div>

    <div class="card-container" id="gameCard"></div>

    <button id="bingoBtn">
      🏆 CLAIM BINGO! 🏆
    </button>

  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    let socket;
    let userCard = [];
    let markedNumbers = [];
    let isGameActive = false;
    let lobbyTimerInterval = null;
    let selectedCardNumber = null;

    const lobbyPage = document.getElementById('lobbyPage');
    const gamePage = document.getElementById('gamePage');

    const lobbyTimerEl = document.getElementById('lobbyTimer');
    const playersCountEl = document.getElementById('playersCount');

    const lobbyBalanceEl = document.getElementById('lobbyBalance');
    const gameBalanceEl = document.getElementById('gameBalance');

    const gamePlayersCountEl = document.getElementById('gamePlayersCount');
    const winningBalanceEl = document.getElementById('winningBalance');

    const currentCallEl = document.getElementById('currentCall');
    const calledListEl = document.getElementById('calledList');

    const selectedNumberEl = document.getElementById('selectedNumber');
    const numberGrid = document.getElementById('numberGrid');

    const lobbyCardPreview = document.getElementById('lobbyCardPreview');

    let takenNumbers = new Set();

    const depositModal = document.getElementById('depositModal');
    const depositPhoneInput = document.getElementById('depositPhone');
    const proofImageInput = document.getElementById('proofImage');

    function renderCard(card, id, clickable = false){

      const cont = document.getElementById(id);

      if(!cont) return;

      cont.innerHTML = '';

      const table = document.createElement('table');

      const letters = ['B','I','N','G','O'];

      const thead = document.createElement('thead');
      const hr = document.createElement('tr');

      letters.forEach(letter => {
        const th = document.createElement('th');

        th.textContent = letter;
        th.style.color = '#f7b32b';
        th.style.fontSize = '1.4rem';

        hr.appendChild(th);
      });

      thead.appendChild(hr);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');

      for(let r=0;r<5;r++){

        const tr = document.createElement('tr');

        for(let c=0;c<5;c++){

          const val = card[r][c];

          const td = document.createElement('td');

          td.textContent = val;

          if(val === 'FREE'){
            td.classList.add('free');
          }

          if(markedNumbers.includes(val)){
            td.classList.add('marked');
          }

          if(clickable && val !== 'FREE'){
            td.style.cursor = 'pointer';

            td.onclick = () => {
              if(!isGameActive) return;

              socket.emit('markNumber', val);
            };
          }

          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      }

      table.appendChild(tbody);

      cont.appendChild(table);
    }

    function showLobby(time){

      lobbyPage.classList.remove('hidden');
      gamePage.classList.add('hidden');

      isGameActive = false;

      startTimer(time || 30);

      if(userCard.length){
        renderCard(userCard, 'lobbyCardPreview');
      }
    }

    function showGame(){

      lobbyPage.classList.add('hidden');
      gamePage.classList.remove('hidden');

      isGameActive = true;

      clearInterval(lobbyTimerInterval);

      if(userCard.length){
        renderCard(userCard, 'gameCard', true);
      }
    }

    function startTimer(s){

      let left = s;

      lobbyTimerEl.textContent = left + 's';

      clearInterval(lobbyTimerInterval);

      lobbyTimerInterval = setInterval(() => {

        left--;

        if(left <= 0){

          clearInterval(lobbyTimerInterval);

          showGame();

        } else {

          lobbyTimerEl.textContent = left + 's';
        }

      },1000);
    }

    function buildNumberGrid(){

      numberGrid.innerHTML = '';

      for(let i=1;i<=100;i++){

        const cell = document.createElement('div');

        cell.className = 'grid-cell';

        cell.dataset.number = i;

        cell.textContent = i;

        if(takenNumbers.has(i)){

          cell.classList.add('taken');

        } else {

          cell.onclick = () => {

            if(isGameActive) return;

            socket.emit('selectCardNumber', i);
          };
        }

        numberGrid.appendChild(cell);
      }

      if(selectedCardNumber){

        const sel = numberGrid.querySelector(
          `[data-number='${selectedCardNumber}']`
        );

        if(sel){
          sel.classList.add('selected');
        }
      }
    }

    function updateGridWithTakenNumbers(nums){

      takenNumbers = new Set(nums);

      buildNumberGrid();
    }

    function getBingoLetter(num){

      if(num >= 1 && num <= 15) return 'B';
      if(num >= 16 && num <= 30) return 'I';
      if(num >= 31 && num <= 45) return 'N';
      if(num >= 46 && num <= 60) return 'G';

      return 'O';
    }

    function formatCall(num){
      return `${getBingoLetter(num)}-${num}`;
    }

    function animateCall(){

      currentCallEl.style.transform = 'scale(1.2)';

      setTimeout(() => {
        currentCallEl.style.transform = 'scale(1)';
      },300);
    }

    function showDepositModal(){

      depositPhoneInput.value = '';
      proofImageInput.value = '';

      depositModal.classList.add('active');
    }

    function closeDepositModal(){
      depositModal.classList.remove('active');
    }

    async function submitDepositWithProof(){

      const phone = depositPhoneInput.value.trim();

      const file = proofImageInput.files[0];

      if(!phone){
        alert('Please enter your phone number');
        return;
      }

      if(!/^0\d{9}$/.test(phone)){
        alert('Invalid phone number');
        return;
      }

      if(!file){
        alert('Please attach payment screenshot');
        return;
      }

      const amountStr = prompt('💰 Enter deposit amount (ETB):');

      if(!amountStr) return;

      const amount = parseFloat(amountStr);

      if(isNaN(amount) || amount <= 0){
        alert('Invalid amount');
        return;
      }

      const formData = new FormData();

      formData.append('phone', phone);
      formData.append('amount', amount);
      formData.append('proof', file);

      try{

        const response = await fetch('/api/request-deposit', {
          method:'POST',
          body:formData
        });

        const data = await response.json();

        alert(data.message || 'Deposit submitted');

        closeDepositModal();

      }catch(err){

        alert('Network error');
      }
    }

    function handleWithdraw(){

      const phone = prompt('📱 Enter phone number');

      if(!phone) return;

      const amountStr = prompt('💰 Withdraw amount');

      if(!amountStr) return;

      const amount = parseFloat(amountStr);

      fetch('/api/request-withdraw',{
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          amount,
          phone
        })
      })
      .then(r => r.json())
      .then(data => {
        alert(data.message || 'Withdraw request sent');
      });
    }

    async function connect(){

      const initData = tg.initData;

      if(!initData){
        alert('Open inside Telegram');
        return;
      }

      try{

        const res = await fetch('/api/telegram-miniapp-auth',{
          method:'POST',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify({
            initData
          })
        });

        const data = await res.json();

        if(!data.success){
          alert('Auth failed');
          return;
        }

      }catch(e){

        alert('Fetch error');
        return;
      }

      socket = io();

      socket.on('connect', () => {

        socket.emit('joinLobby');
      });

      socket.on('balanceUpdate', b => {

        lobbyBalanceEl.textContent = b;
        gameBalanceEl.textContent = b;
      });

      socket.on('lobbyState', state => {

        showLobby(state.startsIn);

        if(state.takenNumbers){
          updateGridWithTakenNumbers(state.takenNumbers);
        }
      });

      socket.on('yourCard', card => {

        userCard = card;

        if(isGameActive){
          renderCard(card, 'gameCard', true);
        }else{
          renderCard(card, 'lobbyCardPreview');
        }
      });

      socket.on('cardTaken', data => {

        updateGridWithTakenNumbers(data.takenNumbers);

        selectedCardNumber = null;

        selectedNumberEl.textContent = '-';
      });

      socket.on('cardSelectionFailed', msg => {
        alert(msg);
      });

      socket.on('playersCount', c => {

        playersCountEl.textContent = c;
        gamePlayersCountEl.textContent = c;

        const entryFee = 10;

        const prize = Math.floor((c * entryFee) * 0.8);

        winningBalanceEl.textContent = prize;
      });

      socket.on('gameStarted', () => {

        showGame();
      });

      socket.on('numberCalled', data => {

        currentCallEl.textContent = formatCall(data.number);

        const formattedList = (data.calledNumbers || [])
          .map(n => formatCall(n));

        calledListEl.textContent =
          'Called: ' + formattedList.join(', ');

        animateCall();
      });

      socket.on('markedNumbers', nums => {

        markedNumbers = nums;

        if(isGameActive){
          renderCard(userCard, 'gameCard', true);
        }else{
          renderCard(userCard, 'lobbyCardPreview');
        }
      });

      socket.on('gameEnded', data => {

        isGameActive = false;

        alert(
          data.winner
          ? '🏆 WINNER: ' + data.winner
          : 'Game ended'
        );
      });

      socket.on('invalidBingo', () => {

        alert('❌ Not a valid bingo yet!');
      });
    }

    document.getElementById('depositBtn').onclick =
      showDepositModal;

    document.getElementById('withdrawBtn').onclick =
      handleWithdraw;

    document.getElementById('randomCardBtn').onclick = () => {

      if(!isGameActive && socket){

        socket.emit('newCardNumber');
      }
    };

    document.getElementById('bingoBtn').onclick = () => {

      if(socket){

        socket.emit('claimBingo');
      }
    };

    document.getElementById('submitDepositBtn').onclick =
      submitDepositWithProof;

    document.getElementById('closeModalBtn').onclick =
      closeDepositModal;

    depositModal.onclick = (e) => {

      if(e.target === depositModal){

        closeDepositModal();
      }
    };

    buildNumberGrid();

    connect();
  </script>

</body>
</html>
